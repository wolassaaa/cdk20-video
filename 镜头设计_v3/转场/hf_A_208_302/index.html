56,540,1.0],[1646.784,540,1.0],[1658.216,540,1.0],[1668.444,540,1.0],[1677.47,540,1.0],[1685.309,540,1.0],[1691.988,540,1.0],[1697.55,540,1.0],[1702.051,540,1.0],[1705.563,540,1.0],[1708.174,540,1.0],[1709.989,540,1.0],[1711.129,540,1.0],[1711.735,540,1.0],[1711.966,540,1.0],[1712.0,540,1.0],[1712.0,540,1.0],[1712.0,540,1.0],[1712.0,540,1.0],[1712.0,540,1.0],[1712.0,540,1.0],[1712.0,540,1.0],[1712.0,540,1.0],[1712.0,540,1.0],[1712.0,540,1.0],[1712.0,540,1.0],[1712.0,540,1.0],[1712.0,540,1.0]],"SEGS":[{"who":"D","x":72,"y":168,"w":620,"h":744,"rot":-1.0,"drop":283.1,"dir":-1,"push":[283.75,284.35],"full":[284.35,286.4],"pull":[286.4,287.0],"hide":null,"sstart":282.55,"show":true}]};
      const T0 = CFG.T0, DUR = CFG.DUR, CAM = CFG.CAM, SEGS = CFG.SEGS;
      const BORDER = 40, W4 = 3840, H4 = 2160;
      const clamp = x => Math.min(1, Math.max(0, x));
      const smoother = x => { x = clamp(x); return x * x * x * (x * (6 * x - 15) + 10); };
      const out3 = x => 1 - Math.pow(1 - clamp(x), 3);
      const span = (F, a) => (F - a[0]) / (a[1] - a[0]);
      const $ = id => document.getElementById(id);

      function camAt(F) { return CAM[Math.min(CAM.length - 1, Math.max(0, Math.round((F - T0) * 60)))]; }

      // closed print (not yet opened): centre on screen, with the drop lift applied
      function closed(s, F) {
        const c = camAt(F), z = c[2], k = 2 * z;
        const lift = F >= s.drop ? 1 - out3((F - s.drop) / 0.5) : 1;
        const wcx = s.x + s.w / 2 - 60 * lift, wcy = s.y + s.h / 2 + 130 * lift;
        return { sx: W4 / 2 + k * (wcx - c[0]), sy: H4 / 2 + k * (wcy - c[1]), k, lift, rot: s.rot + 5 * lift, sc: 1 + 0.05 * lift };
      }
      const wide = s => (s.h * 2 - 2 * BORDER) * 16 / 9 + 2 * BORDER;     // the print opened out to 16:9 (zoom 1)

      function renderAt(t) {
        const F = T0 + t;
        let K = 0, camx = W4 / 2, camy = H4 / 2, S = 1, blur = 0;
        const act = [];
        SEGS.forEach((s, i) => {
          const c = closed(s, F), PW = s.w * 2, PH = s.h * 2, WIDE = wide(s);
          let w = 0, k = 0, full = 0;
          if (s.push && F >= s.push[0] && F < (s.pull ? s.pull[1] : s.full[1])) {
            const d = s.push[1] - s.push[0];            // open runs from 0.12 d to 0.88 d inside the push (sample: 0.15 s to 1.10 s of 1.25 s)
            if (F < s.full[0]) { k = smoother(span(F, s.push)); w = smoother((F - s.push[0] - 0.12 * d) / (0.76 * d)); }
            else k = 1;
          }
          if (s.pull && F >= s.pull[0] && F < s.pull[1]) {
            k = 1 - smoother(span(F, s.pull));
            const d = s.pull[1] - s.pull[0];
            w = 1 - smoother((F - (s.pull[0] + 0.098 * d)) / (0.784 * d));   // close from 0.098 d to 0.882 d (sample: 0.1 s to 0.9 s of 1.02 s)
          } else if (s.full && F >= s.full[0] && F < s.full[1]) { k = 1; w = 1; }
          full = (s.full && F >= s.full[0] && F < s.full[1]) ? 1 : 0;
          const pw = PW + (WIDE - PW) * w;
          const R = c.sx + PW / 2, L = c.sx - PW / 2;
          const pcx = s.dir < 0 ? R - pw / 2 : L + pw / 2;
          if (k > 0) {
            const C1 = s.dir < 0 ? R - WIDE / 2 : L + WIDE / 2;
            const S1 = W4 / (WIDE - 2 * BORDER);
            S = Math.exp(Math.log(S1) * k);
            camx = W4 / 2 + (C1 - W4 / 2) * k;
            camy = H4 / 2 + (c.sy - H4 / 2) * k;
            blur = 18 * k;
          }
          const fe = $("fullwrap" + i);
          fe.style.opacity = full;
          if (s.show) {
            const hideAt = s.hide || 1e9;
            const vis = F >= s.drop && F < hideAt && c.sx + PW / 2 > -120;
            const ph = PH, win = $("window" + i), p = $("print" + i), sh = $("shade" + i);
            p.style.width = pw + "px"; p.style.height = ph + "px";
            const rot = s.rot * (1 - w) + 5 * c.lift;
            p.style.transform = `translate(${pcx - pw / 2}px, ${c.sy - ph / 2}px) rotate(${rot}deg) scale(${c.sc})`;
            p.style.opacity = vis ? clamp((F - s.drop) / 0.08) : 0;
            win.style.width = (pw - 2 * BORDER) + "px"; win.style.height = (ph - 2 * BORDER) + "px";
            sh.style.width = pw + "px"; sh.style.height = ph + "px";
            sh.style.transform = `translate(${pcx - pw / 2 + 24}px, ${c.sy - ph / 2 + 32}px) rotate(${rot}deg)`;
            sh.style.opacity = vis ? 0.3 * w : 0;
          }
        });
        $("cam").style.transform = `translate(${W4 / 2 - S * camx}px, ${H4 / 2 - S * camy}px) scale(${S})`;
        $("filmwrap").style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : "none";
      }

      window.addEventListener("hf-seek", e => renderAt(e.detail.time));
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, onUpdate: () => renderAt(tl.time()) });
      tl.to({}, { duration: DUR }, 0);
      window.__timelines["main"] = tl;
      renderAt(0);
    </script>
